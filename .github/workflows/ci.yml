name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The project has NO external dependencies -- only the C standard library and
# libm -- so none of these jobs installs anything. If a job fails, it is the
# code, not the environment.

jobs:
  unix:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  cc: gcc }
          - { os: ubuntu-latest,  cc: clang }
          - { os: macos-latest,   cc: clang }
    steps:
      - uses: actions/checkout@v4

      - name: Compiler version
        run: ${{ matrix.cc }} --version

      # The central claim of this project is that firmware reaches the datapath
      # ONLY through the register interface. Two violations had crept in and
      # both wrote bits that nothing read, so nothing failed. Assert the claim
      # rather than repeating it in a header.
      - name: Firmware never calls the hardware-side backend
        run: |
          if grep -nE 'hw_reg_set|hw_reg_get|hw_status_set|hw_lane_|hw_macro_' src/fw_*.c; then
            echo "::error::a fw_*.c file reached around the register interface"
            exit 1
          fi
      - name: Firmware contains no floating point
        run: |
          if grep -nE '\b(float|double)\b' src/fw_*.c; then
            echo "::error::floating point found in the firmware layer"
            exit 1
          fi

      - name: Build (make)
        run: make CC=${{ matrix.cc }}

      - name: Unit tests
        run: make CC=${{ matrix.cc }} test

      - name: Channel synthesis check
        run: ./out/ch_probe 30

      - name: CDR loop check
        run: ./out/cdr_probe 20 120 12 0 0 36

      - name: build.sh works too
        run: |
          chmod +x build.sh
          CC=${{ matrix.cc }} ./build.sh test_all

  sanitizers:
    name: ubuntu / asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AddressSanitizer + UndefinedBehaviorSanitizer
        run: make asan
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1

  cmake:
    name: ${{ matrix.os }} / cmake
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  strict-warnings:
    name: ubuntu / -Wconversion -Wshadow (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Pedantic warning pass
        run: make strict
